name: Build & Deploy Laravel (CI/CD)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: build
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Upload Built Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-assets
          path: public/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to Laravel root directory
            cd ~/htdocs/ticket.eileencm.my.id || cd /home/eileencm-ticket/htdocs/ticket.eileencm.my.id

            # Enable maintenance mode
            php artisan down || true

            # Pull latest code
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Build Vite assets directly on server if npm exists
            if command -v npm &> /dev/null; then
              npm install --no-audit --no-fund
              npm run build
            fi

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild cache
            php artisan optimize:clear
            php artisan route:cache
            php artisan view:cache

            # Disable maintenance mode
            php artisan up
